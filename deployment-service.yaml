
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-devsecops-deployment
  namespace: webapps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-devsecops
  template:
    metadata:
      labels:
        app: enterprise-devsecops
    spec:
      containers:
        - name: enterprise-devsecops
          image: hasinullah/enterprise-devsecops-cicd-pipeline:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: enterprise-devsecops-service
  namespace: webapps
spec:
  selector:
    app: enterprise-devsecops
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort
