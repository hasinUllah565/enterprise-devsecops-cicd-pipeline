
# Global configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files: []

# Scrape configurations
scrape_configs:

  # 1. Prometheus monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["192.168.18.15:9090"]
        labels:
          app: "prometheus"

  # 2. Node Exporter monitoring
  - job_name: "node_exporter"
    static_configs:
      - targets: ["192.168.18.15:9100"]

  # 3. Jenkins monitoring
  - job_name: "jenkins"
    metrics_path: "/prometheus"
    static_configs:
      - targets: ["192.168.18.15:8080"]

  # 4. Blackbox Exporter monitoring
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://prometheus.io
          - http://192.168.18.15:30119

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: 192.168.18.15:9115

